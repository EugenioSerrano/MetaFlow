# Example roster — a filled team list (worked example of ../roster.yaml)
#
# ILLUSTRATIVE — copy and instantiate. This is what your real
# `53-actors/roster.yaml` looks like once your team exists: one entry per
# actor, each referencing its `53-actors/<actor-id>.yaml` file. The
# consistency rule — every listed id resolves to an existing actor file —
# applies to the REAL roster.yaml, never to this example (the ids below
# are the worked examples, not files at the 53-actors/ root).
#
# The team shown: one human (who approves ADR/TASK-READY) + one MetaFlow
# Agent (an executor that also approves MEM — enabled by the human who
# wrote its authority fields and listed it here; an agent never enables
# its own approval).

actors:
  - arq-juan       # → 53-actors/arq-juan.yaml   (human — see example-human.yaml)
  - example-qa     # → 53-actors/example-qa.yaml (MetaFlow Agent — see example-agent.yaml)
