# roster.schema.yaml — validates an ACTOR file (actors/<actor-id>.yaml)
# JSON Schema (draft 2020-12) in YAML form. A malformed actor file fails
# fast and the safe default (humans) applies until fixed.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Avenga DevFlow actor file"
type: "object"
additionalProperties: false
required: [id, name, role, modes, approves]   # model is AGENT-required (see
                                              # the allOf) — a human actor
                                              # omits it (human:<user> → model
                                              # null, §3.0.1)
properties:
  id:
    type: "string"
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"      # kebab-case — THE identity
  name:
    type: "string"
    minLength: 1                               # project-chosen free label
  role:
    type: "string"
    minLength: 1                               # open archetype
  model:
    type: "string"
    minLength: 1                               # per-instance, authoritative —
                                               # DevFlow Agent actors only
                                               # (humans omit it)
  modes:
    type: "array"
    minItems: 1
    uniqueItems: true
    items: { "enum": [executor, approver] }
  approves:
    type: "array"
    uniqueItems: true
    items:
      enum: [US, BUG, TC, BOLT-READY, BOLT-DONE, ADR, SPEC, MEM, DISC, REV,
             AREV-CRITIQUE, AREV-DEFENSE, AREV-VERDICT]
  # DevFlow Agent actors only (humans omit this block):
  definition:
    type: "string"
    minLength: 1                               # the reusable blueprint (N:1) —
                                               # a live agent in agents/squad/
  capabilities:                                # OPTIONAL in v1 — the template
    type: "object"                             # defers this block; it returns
    additionalProperties: false                # (and becomes required again for
    required: [tier, tools, mcp_servers]       # agents) with the v2 hardening.
    properties:                                # A file that declares it still
      tier:                                    # validates.
        enum: [T0, T1, T2, T3]
      tools:
        type: "array"
        items: { "type": "string" }
      mcp_servers:
        type: "array"
        items: { "type": "string" }
  escalation:
    type: "array"
    items: { "type": "string" }
  write_paths:
    type: "array"
    items: { "type": "string" }
allOf:
  # v1 rule — the roster entry is the enablement: an approver-mode actor
  # MUST say what it may sign. `approver` in `modes` ⇒ non-empty `approves`.
  - if:
      properties:
        modes:
          contains: { "const": approver }
      required: [modes]
    then:
      properties:
        approves:
          minItems: 1
  # Agent discriminator — every DevFlow Agent actor carries `definition`
  # AND `model` (the model matters for the record and for model-level
  # independence); every human omits both.
  - if:
      required: [definition]
    then:
      required: [model]
  # v2 (deferred): `definition` ⇒ required `capabilities` returns with the
  # v2 hardening (the capability fields left the v1 template; the T0/T1
  # approver ceiling governs as a methodology rule meanwhile).
