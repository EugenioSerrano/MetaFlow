# TEMPLATE — create your own DevFlow Agent (project-defined role)
#
# Copy this folder to agents/squad/<your-role>/, rename the files'
# content and fill every field. The Coordinator (the AvengaDevFlow
# MainAgent) projects ANY agent.yaml in squad/ into its platform wrapper
# and installs it in your tool's spawn folder, following the mapping in
# agents/VERIFICATION.md (the N×4 parity check as the safety net).
#
# NON-NEGOTIABLE BOUNDS (everything else is your team's freedom):
#   - Authority lives in these structured fields, NEVER in prose (the
#     identity model).
#   - `approves` only real checkpoint codes (US, BUG, TC, BOLT-READY,
#     BOLT-DONE, ADR, SPEC, MEM, DISC, REV, AREV-*).
#   - APPROVER CEILING (approver mode): an agent acting as approver runs
#     at T0 (at most T1 pinned), no write paths, no transactional MCPs.
#   - Independence: an approver is always a different actor than the
#     executor (approver.id ≠ executor.id).
id: <your-agent-id>          # kebab-case — THE identity (independence checks,
                             # the roster). Pick once; renaming prompts never
                             # changes the identity.
role: <your-role>            # archetype: coordinator | functional-analyst |
                             # architect | developer | qa | reviewer |
                             # project-defined… (open — never a closed enum)
description: >              # when the Coordinator should delegate to you
  <one or two sentences: what you do, when the Coordinator spawns you>
model: inherit               # safe default: follow the session model; you may
                             # pick any model from the platform catalog
modes: [executor]            # executor (production, first-class) | approver
                             # (configured second role — see the ceiling above)
approves: []                 # checkpoint classes you may sign; EMPTY =
                             # executor-only (may never sign)
capabilities:
  tier: T1                   # T0 repo-only | T1 +read-only external |
                             # T2 transactional MCPs | T3 unrestricted
  tools: [read, grep, glob, bash, edit, write]   # least-privilege allowlist
  mcp_servers: []            # named + allowlisted; [] default — no implicit
                             # MCP exposure (the MCP allowlist rule)
escalation:                  # when you MUST defer (always allowed above the
                             # engine floor)
  - "<your escalation trigger 1>"
  - "<your escalation trigger 2>"
write_paths: []              # the folders you write (G30/G31 mirror);
                             # approver-mode agents write nothing
