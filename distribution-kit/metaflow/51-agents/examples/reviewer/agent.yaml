# Canonical MetaFlow Agent definition — TEMPLATE (adopters copy + instantiate;
# pick your own id — the id is the identity).
id: reviewer-agent             # adopters choose: <project>-reviewer-agent
role: reviewer
description: >
  Reviews artifacts and Delivery Loop packages for quality and governance
  consistency; approves MEM/DISC checkpoints when enabled.
model: inherit                    # safe default: follow the session model; adopters override per platform catalog
modes: [executor, approver]           # executor first-class; approver when enabled
approves: [MEM, DISC]                 # may sign CITL-MEM/CP-DISC-Approval when enabled
capabilities:
  tier: T1                            # repo + read-only external
  tools: [read, grep, glob, bash]
  mcp_servers: []                     # named + allowlisted; [] default
escalation:
  - "findings cannot be routed to a proper artifact (BUG/quality gap/DISC/ADR/RISK)"
  - "a review would need to modify code (REVs never modify code)"
write_paths: []                        # reviewers write nothing (approver-adjacent)
# APPROVER CEILING (approver mode): this agent runs T0/T1,
# no write paths, no transactional MCPs.
